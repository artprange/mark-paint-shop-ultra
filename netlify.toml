[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[build.environment]
  # Sem isto o Netlify escolhe a versão padrão dele, que pode ser mais antiga
  # do que o Vite 6 e as functions em ESM esperam.
  NODE_VERSION = "22"

# A aplicação é uma SPA: qualquer rota precisa cair no index.html, senão
# recarregar /products direto no navegador devolve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
